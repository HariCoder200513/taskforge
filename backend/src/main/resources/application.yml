spring:
  application:
    name: taskforge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskforge}
    username: ${DB_USERNAME:taskforge}
    password: ${DB_PASSWORD:taskforge}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
