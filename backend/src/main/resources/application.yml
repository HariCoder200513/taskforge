spring:
  application:
    name: taskforge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskforge}
    username: ${DB_USERNAME:taskforge}
    password: ${DB_PASSWORD:taskforge}
    hikari:
      data-source-properties:
        # Send String params as untyped so Postgres infers citext (case-insensitive)
        # instead of comparing the citext email column as plain text.
        stringtype: unspecified
  jpa:
    hibernate:
      # Flyway owns the schema entirely; Hibernate neither creates nor validates
      # it (custom PG types citext/jsonb do not round-trip through validate).
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

auth:
  jwt:
    issuer: taskforge
    audience: taskforge-api
    access-token-ttl: 15m
    # Allowed clock drift when validating exp/iat. Issuer and validator are the
    # same server, so this can be small.
    clock-skew: 30s
    active-kid: ${AUTH_JWT_KID:dev}
    # PEM keys for RS256. If blank, an RSA keypair is generated at startup
    # (DEV ONLY — tokens won't survive a restart). Prod loads from Secrets Manager.
    public-key-pem: ${AUTH_JWT_PUBLIC_KEY:}
    private-key-pem: ${AUTH_JWT_PRIVATE_KEY:}
  refresh:
    sliding-ttl: 14d
    absolute-ttl: 30d
    grace-window: 30s
    cookie-name: tf_refresh
    cookie-path: /api/v1/auth
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  csrf:
    header-name: X-CSRF-Token
    # Origins accepted on cookie endpoints. In prod (same-origin via Netlify
    # proxy) requests carry no cross-origin Origin; set the app origin for dev.
    allowed-origins: ${AUTH_CSRF_ORIGINS:http://localhost:5173}
  cors:
    # Disabled in prod (same-origin). Enable for local dev hitting the API directly.
    enabled: ${AUTH_CORS_ENABLED:false}
    allowed-origins: ${AUTH_CORS_ORIGINS:http://localhost:5173}
  proxy:
    # When set, the backend trusts the forwarded client-IP header only on
    # requests carrying this secret (injected by the Netlify proxy).
    secret: ${AUTH_PROXY_SECRET:}
    client-ip-header: X-Nf-Client-Connection-Ip

# Worker/queue engine. Jobs are claimed with FOR UPDATE SKIP LOCKED (safe across
# replicas), retried with exponential backoff, and dead-lettered once attempts
# are exhausted; a reaper requeues jobs abandoned by crashed workers.
worker:
  enabled: ${WORKER_ENABLED:true}
  poll-interval: 1s
  reap-interval: 30s
  batch-size: 5
  retry-base-backoff: 10s
  retry-max-backoff: 10m
  # A RUNNING job with no heartbeat for this long is treated as abandoned.
  lease-timeout: 2m
